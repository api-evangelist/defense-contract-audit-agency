domain_standards:
  - id: cage-code
    conforms: true
    evidence: >-
      The API publishes the CAGE code format it accepts at
      /api/angularconfiguration/get-cage-code-regex ("^\\w{5}$") and takes CAGE code as
      searchType 0 — the NATO/DLA Commercial and Government Entity code, the identifier
      scheme US defense contracting runs on.
  - id: sam-uei
    conforms: true
    evidence: >-
      /api/angularconfiguration/get-uei-regex publishes
      "^[1-9A-HJ-NP-Z][\\dA-HJ-NP-Z]{11}$" — the SAM.gov 12-character Unique Entity
      Identifier that replaced DUNS across federal awards — and searchType 1 resolves a
      field audit office by UEI.
    note: >-
      This is the domain-standard signature that matters for a defense-contract-audit
      surface: an integrator who already speaks CAGE/UEI needs no bespoke mapping to find
      the cognizant DCAA office for a contractor.
