description: >-
  DCAA publishes no API plans and no pricing of any kind. It is a US Department of Defense
  audit agency, not a commercial API provider. Its one public JSON surface — the Field
  Audit Office Branch Locator API at https://fao.dcaa.mil/api — is free, anonymous and
  unmetered, with no sign-up, no key issuance and no tier structure. Its gated Contractor
  Submission Portal is reached with a DoD PIEE account, which is issued through DoD
  identity processes and is likewise not sold. plan_count is 0 as a measured fact, not as
  a placeholder.
