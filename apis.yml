apis:
  - aid: defense-contract-audit-agency:branch-locator
    name: DCAA Field Audit Office Branch Locator API
    description: >-
      The public JSON backend of DCAA's Field Audit Office Branch Locator. It resolves the
      DCAA field audit office cognizant over a contractor from a CAGE code (searchType 0),
      a SAM.gov Unique Entity Identifier (searchType 1) or a US ZIP code (searchType 2),
      returning the branch name, phone, email and address along with region information.
      Three companion endpoints publish the regular expressions the API validates each
      identifier against, and two more publish the current service notice. Everything is
      anonymous, read-only and free. DCAA publishes NO specification, NO documentation and
      NO terms for it — this entry was established by live probing on 2026-09-07 (six
      operations observed returning HTTP 200/400/404), which is why no OpenAPI pointer is
      wired: none exists, and authoring one would credit DCAA with a contract it has never
      published. Validation failures return RFC 9457 application/problem+json with a W3C
      trace-context traceId.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/defense-contract-audit-agency.png
    humanURL: https://fao.dcaa.mil/
    baseURL: https://fao.dcaa.mil/api
    tags:
