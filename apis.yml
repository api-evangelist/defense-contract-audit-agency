  - aid: defense-contract-audit-agency:contractor-submission-portal
    name: DCAA Contractor Submission Portal (CSP)
    description: >-
      The portal a defense contractor uses to file, update or withdraw a certified incurred
      cost submission with DCAA. It is a DCAA-operated application on a DCAA host, but every
      path redirects unauthenticated callers to the DoD Procurement Integrated Enterprise
      Environment (PIEE) authorization endpoint — OAuth 2.0 authorization code with PKCE
      (S256), client_id csp, scopes openid and profile. Access requires a DoD PIEE account,
      not a developer credential. No API, no specification and no machine-readable contract
      are published for it; it is recorded here because it is the agency's only write
      surface and its authentication model is observable. Listed as gated, not as a
      callable API.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/defense-contract-audit-agency.png
    humanURL: https://csp.dcaa.mil/
    baseURL: https://csp.dcaa.mil
