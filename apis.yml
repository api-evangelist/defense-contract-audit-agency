aid: defense-contract-audit-agency
name: Defense Contract Audit Agency
url: >-
  https://raw.githubusercontent.com/api-evangelist/defense-contract-audit-agency/refs/heads/main/apis.yml
description: >-
  The Defense Contract Audit Agency (DCAA), under the authority, direction, and control of
  the Under Secretary of Defense (Comptroller), provides audit and financial advisory
  services to the Department of Defense and other federal entities responsible for
  acquisition and contract administration. DCAA runs no developer program: no API
  documentation, no OpenAPI, no SDK, no MCP server, no agent card and no /.well-known
  surface exist on any host it operates. It does serve one public, unauthenticated and
  undocumented JSON API — the Field Audit Office Branch Locator at
  https://fao.dcaa.mil/api — which resolves the cognizant DCAA audit office for a
  contractor by CAGE code, SAM.gov UEI or ZIP code and returns RFC 9457 problem details on
  validation failure. A second, gated surface, the Contractor Submission Portal at
  https://csp.dcaa.mil, takes certified incurred cost submissions behind an OpenID Connect
  sign-in federated to DoD PIEE.
