providerId: defense-contract-audit-agency
generated: '2026-09-07'
method: probed
source: >-
  live responses from https://fao.dcaa.mil/api, observed 2026-09-07, plus a search of
  https://www.dcaa.mil/ for any published usage policy.
created: '2026-05-22'
modified: '2026-09-07'
tags:
- Federal Government
