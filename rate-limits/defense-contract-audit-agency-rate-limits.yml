description: >-
  DCAA publishes no rate limits, and its public Branch Locator API emits no rate-limit
  signal on the wire. Successful responses carry only Content-Type, Date,
  Strict-Transport-Security and Transfer-Encoding — no X-RateLimit-*, no RateLimit-*, no
  Retry-After, and no 429 was observed across the probes run for this pass. An agent has
  no runtime budget signal to read here and should self-throttle conservatively against a
  government host.
limit_count: 0
headers: {}
observed_response_headers:
- Content-Type
- Date
- Strict-Transport-Security
- Transfer-Encoding
responseCodes:
  throttled: null
  quotaExceeded: null
limits: []
notes:
- >-
  This file previously carried a scaffold with invented free/pro tiers, invented
  per-minute limits and burst values, an invented header set and an invented domain
  (defense-contract-audit-agency.example). None of it was published by DCAA; it has been
  removed and replaced with the measured result.
- >-
  Absence of a limit is not a licence to hammer the host. www.dcaa.mil already answers 403
  to non-browser clients at the Akamai edge, which is the agency's de facto automated-access
  posture.
